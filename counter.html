<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Портал наследия - кликер</title>
    <style>
        header {
            background-color: blue;
            color: white;
        }
        main {
            background-color: white;
            color: black;
        }
        footer {
            color: gray;
            background-color: black;
            text-align: center;
        }
        button {
            background-color: gray;
            color: white;
            border-radius: 35px;
            border: 1px solid blue;
            width: 95%;
            height: 95%;
        }
        #button2{
            background-color: gray;
            color: white;
            border-radius: 35px;
            border: 1px solid blue;
            width: 95%;
            height: 95%;
            text-align: center;
        #logo {
            text-align: center;
            margin-top: 1px;
        }
        
        .center-content {
            text-align: center;
        }
        #card {
            border: 1px solid blue;
            border-radius: 15px;
            text-align: center;
            padding: 20px; 
        }
        h2 {
            color: blue;
        }
        #window {
            background-color: blue;
            color: white;
            margin: 2% 2% 2% 2%;
            border-radius: 15px;
            display: inline-block; 
            padding: 10px 20px;
            min-width: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id='logo'>Портал наследия</h1>
    </header>

    <main>
        <div id='card'>
            
            <div class="center-content">
                <h2>Кликер!</h2>
                
                <button id="click-btn" type='button' onclick='plus()'>Клик!</button>
                <div id="window">Нажмите на «Клик!» </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Сайт запущен в <u>Тестовом</u> режиме</p>
        <br>
        
        <button type='button' id='button2' onclick='window.print()'>Распечатать</button>
    </footer>

    
    <script>
        var counter = 0;

        function plus() {
            counter++; 
            document.getElementById('window').innerHTML = counter;
        }
    </script>
</body>
</html>
