<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    
<title>Портал наследия - кликер</title>

<script>
    var counter = 0
    function plus(){
        counter = counter + 1;
        document.getElementById('window').innerHTML = (counter);

</script>
</head>

<body>

    <style>
        header{
            background-color: blue;
            color: white;
    }
    main{
        background-color: white;
        color: black;
}
    footer{
        color: gray;
        background-color: black;
        text-align: center;
} 
    button{
        background-color: gray;
        color: white;
        border-radius: 35px;
        border: 1px solid blue;
        width: 95%;
        height: 95%;
   } 
   #logo{
       text-align: center;
       margin-top: 1px;
} 
#center{
        text-align: center;
} 

#card{
        border: 1px solid blue;
        border-radius: 15px;
        text-align: center;
} 

    h2{
        color: blue;
} 

    #window{
        background-color: blue;
        color: white;
        margin: 2% 2% 2% 2%;
        border-radius: 15px;
    } 
    </style>
    <header>
        <h1 id='logo' >Портал наследия</h1>
          </header>


    <main>
        <div id='card'>

        <h2 id='center'>Кликер!</h2>

            <button type='button' onclick='plus()'>Клик!</button>
            <h2 id="window"></h2>
        </div>
        

    </main>

    <footer>
        <p>Сайт запущен в <u>Тестовом</u> режиме</p>
       <br></br>
       

     <button id='center' onclick='window.print()' type='button'>Распечатать</button>
    </footer>
</body>

</html>
