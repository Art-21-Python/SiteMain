<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
    <title>Портал наследия - кликер</title>

    <link rel='stylesheet' type="text/css" href="style.css">
    
</head>
<body>

    <header>
        <h1 id='logo'>Портал наследия</h1>
    </header>

    <main>
        <div class='card'>
            
            <div class="center">
                <h2>Кликер!</h2>
            
                <div id="window">Загрузка...</div>

                <div id="status">Нажмите на экран</div>
                <br></br>
            </div>
        </div>
    </main>

    <footer class='center'>
        <p>Игра «Кликер», версия 1.1</p>
        <p>Сайт запущен в <u>Тестовом</u> режиме</p>
        <br>
        
        <button type='button' onclick='window.print()'>Распечатать</button>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>


    
    <script>
        
    $('main').click(function() {
        
        let counter = localStorage.getItem('save') ? parseInt(localStorage.getItem('save'), 10) : 0;
        counter++;
        document.getElementById('window').innerHTML = counter;
        localStorage.setItem('save', counter);
        if (counter >= 10000) {
        document.getElementById('status').innerHTML = 'Нереально';
    } else if (counter >= 5000) {
        document.getElementById('status').innerHTML = '2 + 2 = 5000';
    } else if (counter >= 1000) {
        document.getElementById('status').innerHTML = 'Тысяча, тысяча!';
    } else if (counter >= 500) {
        document.getElementById('status').innerHTML = 'Молодец';
    } else if (counter >= 100) {
        document.getElementById('status').innerHTML = 'Любитель';
    } else {

        document.getElementById('status').innerHTML = 'Начинающий';
    }
    })

    window.onload = function() {
        const savedCounter = localStorage.getItem('save');
        if (savedCounter) {
            document.getElementById('window').innerHTML = savedCounter;
        } else {
            
            document.getElementById('window').innerHTML = '0';
        }
    };
    </script>
</body>
</html>
