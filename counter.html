<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Портал наследия - кликер</title>
    <style>
        header {
            background-color: blue;
            color: white;
        }
        main {
            background-color: white;
            color: black;
        }
        footer {
            color: gray;
            background-color: black;
            text-align: center;
        }
        button {
            background-color: gray;
            color: white;
            border-radius: 35px;
            border: 1px solid blue;
            width: 95%;
            height: 95%;
        }
        #logo {
            text-align: center;
            margin-top: 1px;
        }
        
        .center-content {
            text-align: center;
        }
        #card {
            border: 1px solid blue;
            border-radius: 15px;
            text-align: center;
            padding: 20px; 
        }
        h2 {
            color: blue;
        }
        #window {
            background-color: blue;
            color: white;
            margin: 2% 2% 2% 2%;
            border-radius: 15px;
            display: inline-block; 
            padding: 10px 20px;
            min-width: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id='logo'>Портал наследия</h1>
    </header>

    <main>
        <div id='card'>
            
            <div class="center-content">
                <h2>Кликер!</h2>
                
                <button id="click-btn" type='button' onclick='plus()'>Клик!</button>
                <div id="window">Загрузка...</div>

                <div id=status>Нажмите «Клик!»</div>
            </div>
        </div>
    </main>

    <footer>
        <p>Сайт запущен в <u>Тестовом</u> режиме</p>
        <br>
        
        <button type='button' onclick='window.print()'>Распечатать</button>
    </footer>

    
    <script>
        
    function plus() {
        
        let counter = localStorage.getItem('save') ? parseInt(localStorage.getItem('save'), 10) : 0;
        counter++;
        document.getElementById('window').innerHTML = counter;
        localStorage.setItem('save', counter);
        if (counter < 100){
            document.getElementById ('status').innerHTML = 'Начинающий';
        } 
        
    }

    window.onload = function() {
        const savedCounter = localStorage.getItem('save');
        if (savedCounter) {
            document.getElementById('window').innerHTML = savedCounter;
        } else {
            
            document.getElementById('window').innerHTML = '0';
        }
    };
    </script>
</body>
</html>
